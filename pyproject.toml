[project]
name = "synapse-game-profiles"
version = "0.1.0"
description = "Launcher-aware game detection and per-application Synapse profile mapping UI"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11.0",
    "psutil>=7.0",
    "PySide6>=6.8",
]

[project.optional-dependencies]
synapse = [
    "SynapseCTRL>=0.3.0",
]

[project.scripts]
synapse-game-profiles = "synapse_game_profiles.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_game_profiles"]
