[project]
name = "synapse-game-profiles"
version = "1.0.0"
description = "Launcher-aware game detection and per-application Synapse profile mapping UI"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11.0",
    "psutil>=7.0",
    "PySide6>=6.8",
    "SynapseCTRL>=0.3.1",
]

[project.optional-dependencies]
build = [
    "Nuitka>=4.2.1,<5",
    "ordered-set>=4.1.0",
    "zstandard>=0.23.0",
]

[project.scripts]
synapse-game-profiles = "synapse_game_profiles.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_game_profiles"]
